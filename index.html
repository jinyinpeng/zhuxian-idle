<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0c0a09" />
<meta name="description" content="诛仙问道 · 3D 洞天：Three.js 实时挂机修仙。自动寻怪、装备强化、境界突破、离线收益。" />
<!-- 品牌印记：夜底 + 金环 + 立剑，与游戏内 .brand-mark 同一套符号 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230c0a09'/><circle cx='32' cy='31' r='21' fill='none' stroke='%23facc15' stroke-opacity='.30' stroke-width='2'/><path d='M32 10 37.5 30 32 39.5 26.5 30Z' fill='%23facc15'/><rect x='20' y='39' width='24' height='4' rx='2' fill='%23ca8a04'/><rect x='30' y='42' width='4' height='12' rx='2' fill='%23ca8a04'/></svg>" />
<meta name="apple-mobile-web-app-title" content="诛仙问道" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>诛仙问道 · 3D 洞天</title>
<style>
  /* 这一页只是「入口」：拿发布号 → 跳进 3D 洞天。
     平时一闪而过，所以做成与游戏一致的夜底 + 金环，避免亮屏闪白。 */
  html, body { margin: 0; height: 100%; background: #06080c; color: #e7e5e4;
    font: 13px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  .boot { height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .ring { width: 46px; height: 46px; border-radius: 50%;
    border: 3px solid rgba(250, 204, 21, .2); border-top-color: #facc15;
    animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 17px; font-weight: 600; letter-spacing: 2px; color: #facc15; }
  .sub { color: #a8a29e; font-size: 12px; }
  .alt { margin-top: 6px; color: #78716c; font-size: 11.5px; line-height: 2; }
  .alt a { color: #facc15; text-decoration: none; border-bottom: 1px solid rgba(250, 204, 21, .35); }
  .alt a.dim { color: #a8a29e; border-bottom-color: rgba(168, 162, 158, .3); }
</style>
</head>
<body>
<div class="boot">
  <div class="ring"></div>
  <div class="title">诛仙问道</div>
  <div class="sub">正在进入 3D 洞天…</div>
  <div class="alt">
    没反应？<a href="play3d.html" id="go3d">点此进入 3D</a><br />
    想看完整的挂机主界面（2D 版）：<a class="dim" href="game2d.html">进入 2D 完整版</a>
  </div>
</div>

<script>
/* ============================================================================
 * 默认入口：打开本站即进 3D 洞天（play3d.html）。
 * ----------------------------------------------------------------------------
 * 为什么要先取 version.json：
 *   3D 页靠 URL 上的 ?v= 知道"自己属于哪一版"，再据此轮询判断要不要自动更新。
 *   若这里不带版本号，3D 页会失去自动更新能力（它会读到空版本而不敢比对，
 *   否则 '' ≠ 线上版本会导致无限刷新）。
 * 兜底：1.5 秒内拿不到版本也照样跳（不带 ?v=），保证弱网/离线也能进游戏。
 * 发布号仍只有 game2d.html 的 CUR 与 version.json 两处来源，这一页不用手改。
 * ========================================================================== */
(function () {
  var jumped = false;
  var link = document.getElementById('go3d');
  function jump(v) {
    if (jumped) return;
    jumped = true;
    location.replace('play3d.html' + (v ? ('?v=' + encodeURIComponent(v)) : ''));
  }
  /* 手动点击时带上已知版本，避免走一次多余的跳转 */
  var known = '';
  link.addEventListener('click', function (e) { e.preventDefault(); jump(known); });

  var timer = setTimeout(function () { jump(known); }, 1500);
  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) { known = (j && j.v) || ''; clearTimeout(timer); jump(known); })
    .catch(function () { clearTimeout(timer); jump(known); });
})();
</script>
</body>
</html>
