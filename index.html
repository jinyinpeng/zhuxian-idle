<script>
/* 首屏即定主题（日/夜），避免夜间用户先闪一帧亮色；
   同时在 <html> 上打 data-mode，CSS 才能按模式着色。存档键与 core.js 的 SAVE_KEY 一致。 */
(function () {
  var mode = 'day';
  try {
    var raw = localStorage.getItem('zhuxian_idle_save_v1');
    if (raw) {
      var st = JSON.parse(raw);
      if (st && st.settings && st.settings.dayMode === false) mode = 'night';
    }
  } catch (e) { }
  document.documentElement.setAttribute('data-mode', mode);
  var mt = document.querySelector('meta[name="theme-color"]');
  if (mt) mt.setAttribute('content', mode === 'day' ? '#e7eef4' : '#0c0a09');
})();
</script>
<script src="js/viewport.js?v=202609240013"></script>

<body>
<div id="app">

  <!-- ===================== 角色创建 ===================== -->
  <section id="screen-create" class="screen">
    <div class="create-sky"></div>
    <div class="create-ridge cr1"></div>
    <div class="create-ridge cr2"></div>
    <div class="create-veil"></div>
    <div class="create-inner">
      <header class="brand">
        <div class="brand-mark"><svg class="ic"><use href="#i-swords"></use></svg></div>
        <h1 class="brand-title">诛仙问道</h1>
        <p class="brand-sub">一剑霜寒十四州 · 万古仙途任我行</p>
      </header>

      <div class="card field-card">
        <div class="field-row">
          <span class="field-label">道号</span>
          <input id="in-name" class="text-input" maxlength="8" value="无名散修" autocomplete="off" spellcheck="false" />
          <button id="btn-name" class="ghost-btn" aria-label="随机道号"><svg class="ic"><use href="#i-refresh-cw"></use></svg></button>
        </div>
        <div class="field-label sect-label">性别</div>
        <div class="gender-row" id="gender-row">

        </div>
        <div class="field-label sect-label">择一门派</div>

  <!-- ===================== 主界面 ===================== -->

      <div class="clouds"><div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div></div>
      <div class="stars"></div>
      <div class="moon"></div>
      <div class="shaft"></div><div class="shaft s2"></div>
      <div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div>
      <div class="qi"><i class="q1"></i><i class="q2"></i><i class="q3"></i></div>
      <div class="ridge-x2"></div>
      <div class="ridge-x1"></div>
      <div class="ridge ridge-far" id="ridge-far"></div>
      <div class="ridge ridge-mid" id="ridge-mid"></div>
      <div class="ridge ridge-near" id="ridge-near"></div>
      <div class="haze z1"></div><div class="haze z2"></div>
      <div class="ground"></div>
      <div class="cloudsea"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
      <!-- 真实背景图：存在 assets/bg_r01.(jpg|png) … bg_r08.(jpg|png) 时自动启用，
           缺失则完整回退到上面这套 CSS 场景（连接方式见 js/render.js 的 applyBackdrop） -->

        <!-- r03 万蝠古窟：岩壁 + 钟乳石 + 飞蝠 -->

        <!-- r04 焚香谷外：火山 + 熔岩裂隙 -->

        <!-- r06 女娲神庙：石柱 + 殿阶 + 香火 -->
        <div class="sc sc-r06"><div class="pillar p1"></div><div class="pillar p2"></div><div class="pillar p3"></div><div class="pillar p4"></div><div class="incense i1"></div><div class="incense i2"></div><div class="temple-floor"></div></div>
        <!-- r07 通天峰：剑峰 + 云梯 + 飞雪 -->
        <div class="sc sc-r07"><div class="peak k1"></div><div class="peak k2"></div><div class="peak k3"></div><div class="stair"></div><div class="snow"></div></div>
        <!-- r08 诛仙剑阵：血雾 + 剑林 + 阵图 -->
        <div class="sc sc-r08"><div class="bloodmist"></div><div class="swordland"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="array"></div></div>
      </div>
      <div class="fg"></div>
      <div class="grade"></div><div class="grade2"></div><div class="lift"></div>
      <canvas class="fx" id="fx"></canvas>
      <div class="hud-top" id="hud-top"></div>

    <div class="dash" id="dash"></div>

<script>
/* ===================== 自动更新到最新版 =====================
   发布时 BUILD 会被替换为发布时间戳：
     · 资源带 ?v=BUILD → 永不命中旧缓存
     · 每 45 秒 / 每次切回前台检查 version.json，发现新版自动刷新
   存档在 localStorage，刷新不会丢进度。 */
(function () {
  var CUR = '202609240013';
  var busy = false;
  function check() {
    if (busy) return;
    busy = true;
    var url = 'version.json?t=' + Date.now();
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        busy = false;
        if (!j || !j.v || j.v === CUR) return;
        try { if (window.LXU && window.LXU.toast) window.LXU.toast('发现新版本，正在更新…'); } catch (e) {}
        setTimeout(function () {
          location.replace(location.pathname + '?v=' + encodeURIComponent(j.v));
        }, 700);
      })
      .catch(function () { busy = false; });
  }
  setInterval(check, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
})();
</script>
