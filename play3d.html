<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>诛仙问道 · 3D 洞天</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#06080c;
    font:13px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e7e5e4; }
  #stage { position:fixed; inset:0; display:block; touch-action:none; }
  .hud { position:fixed; left:0; right:0; z-index:5; pointer-events:none; }
  #top { top:0; padding:calc(8px + env(safe-area-inset-top)) 12px 0; }
  .row { display:flex; align-items:center; gap:7px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(10,14,20,.62);
    border:1px solid rgba(250,204,21,.35); color:#facc15; letter-spacing:.06em; white-space:nowrap; }
  .bar { position:relative; height:9px; border-radius:999px; overflow:hidden; flex:1;
    background:rgba(8,12,18,.72); border:1px solid rgba(255,255,255,.14); }
  .bar > i { position:absolute; inset:0; transform-origin:left center; transition:transform .16s linear; }
  .bar.hp > i { background:linear-gradient(90deg,#f87171,#ef4444); }
  .bar.mp > i { background:linear-gradient(90deg,#38bdf8,#0ea5e9); }
  .bar em { position:absolute; inset:0; text-align:center; font:10px/9px system-ui; font-style:normal;
    color:#fff; text-shadow:0 1px 2px #000; }
  .barwrap { width:min(40vw,230px); }
  .lbl { font-size:11px; color:#a8a29e; width:22px; }
  .lbl.r { text-align:right; }
  #bottom { bottom:0; padding:0 12px calc(10px + env(safe-area-inset-bottom)); display:flex;
    justify-content:space-between; align-items:flex-end; gap:10px; }
  .panel { pointer-events:auto; background:rgba(10,14,20,.6); border:1px solid rgba(255,255,255,.13);
    border-radius:12px; padding:8px 10px; backdrop-filter:blur(6px); }
  #log { width:min(44vw,320px); max-height:104px; overflow:hidden; font-size:11.5px; color:#d6d3d1; }
  #log b { color:#facc15; } #log .hit { color:#fca5a5; } #log .sk { color:#7dd3fc; }
  #toast { position:fixed; left:50%; top:32%; transform:translate(-50%,-50%) scale(.9); z-index:6;
    font:700 22px/1.3 system-ui; color:#facc15; text-shadow:0 2px 14px rgba(250,204,21,.55),0 2px 4px #000;
    opacity:0; transition:opacity .16s,transform .16s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  /* 伤害飘字：把 3D 坐标投影到屏幕，用 DOM 渲染 —— 比 3D 文字便宜得多，也更清晰 */
  #floaters { position:fixed; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .flo { position:absolute; font:700 15px/1 ui-monospace,monospace; white-space:nowrap;
    text-shadow:0 2px 6px #000,0 0 12px currentColor; transform:translate(-50%,-50%);
    animation:floUp .86s cubic-bezier(.2,.9,.3,1) forwards; }
  .flo.crit { font-size:21px; letter-spacing:.02em; }
  .flo.heal { font-size:16px; }
  @keyframes floUp {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(.7); }
    18%  { opacity:1; transform:translate(-50%,-70%) scale(1.12); }
    100% { opacity:0; transform:translate(-50%,-190%) scale(.95); }
  }
  .btn { pointer-events:auto; border:1px solid rgba(255,255,255,.16); background:rgba(10,14,20,.6);
    color:#e7e5e4; border-radius:10px; padding:7px 11px; font-size:12px; white-space:nowrap; }
  .btn.gold { border-color:rgba(250,204,21,.5); color:#facc15; }
  select.btn { padding:6px 8px; }
  #fps { position:fixed; right:10px; top:calc(48px + env(safe-area-inset-top)); z-index:6;
    font:11px/1.45 ui-monospace,monospace; color:#a8a29e; text-align:right; white-space:pre; }
  #hint { position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:5; font-size:11px; color:#a8a29e; background:rgba(10,14,20,.5); padding:4px 10px;
    border-radius:999px; transition:opacity .4s; }
  /* ---------- 地图：节点图 ---------- */
  #mapWrap { position:fixed; inset:0; z-index:8; display:none; background:rgba(4,6,10,.82);
    backdrop-filter:blur(7px); padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)); }
  #mapWrap.on { display:flex; flex-direction:column; }
  #mapHead { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  #mapHead h3 { margin:0; font-size:15px; font-weight:600; }
  #mapHint { font-size:11.5px; color:#a8a29e; }
  #mapBody { flex:1; min-height:0; position:relative; overflow:hidden; }
  #mapSvg { position:absolute; inset:0; width:100%; height:100%; }
  #mapBody .node { position:absolute; transform:translate(-50%,-50%); text-align:center; cursor:pointer; }
  #mapBody .dot { width:26px; height:26px; margin:0 auto 4px; border-radius:50%;
    border:2px solid rgba(255,255,255,.35); background:rgba(12,16,22,.9);
    display:flex; align-items:center; justify-content:center; font-size:12px; }
  #mapBody .nm { font-size:11.5px; white-space:nowrap; color:#d6d3d1; }
  #mapBody .lv { font-size:10px; color:#78716c; }
  #mapBody .node.here .dot { border-color:#facc15; box-shadow:0 0 0 3px rgba(250,204,21,.25), 0 0 18px rgba(250,204,21,.5); }
  #mapBody .node.here .nm { color:#facc15; font-weight:600; }
  #mapBody .node.found .dot { border-color:rgba(94,234,212,.75); }
  #mapBody .node.known:not(.found) .dot { border-style:dashed; opacity:.7; }
  #mapBody .node.lock { opacity:.4; cursor:not-allowed; }
  #mapBody .node.lock .nm::after { content:' 🔒'; }
  /* ---------- 奇遇弹窗 ---------- */
  #encWrap { position:fixed; inset:0; z-index:9; display:none; align-items:center; justify-content:center;
    background:rgba(4,6,10,.7); padding:20px; }
  #encWrap.on { display:flex; }
  #encBox { width:min(92vw,420px); background:linear-gradient(180deg,rgba(24,20,18,.98),rgba(12,10,9,.99));
    border:1px solid rgba(250,204,21,.35); border-radius:16px; padding:16px; }
  #encTitle { font-size:15px; font-weight:600; color:#facc15; margin-bottom:8px; }
  #encText { font-size:13px; line-height:1.7; color:#d6d3d1; margin-bottom:12px; }
  .encChoice { display:block; width:100%; text-align:left; margin-bottom:7px; padding:10px 12px;
    border:1px solid rgba(255,255,255,.16); background:rgba(10,14,20,.6); color:#e7e5e4;
    border-radius:10px; font-size:12.5px; }
  .encChoice:hover { border-color:rgba(250,204,21,.5); color:#facc15; }
  .encChoice em { font-style:normal; color:#a8a29e; font-size:11px; }
  #loading { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; background:#06080c; transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  .ring { width:44px; height:44px; border-radius:50%; border:3px solid rgba(250,204,21,.2);
    border-top-color:#facc15; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #ltxt { color:#a8a29e; font-size:12px; } #lsub { color:#57534e; font-size:11px; }
</style>
<!-- three.js 已本地化到 assets/three/（只保留实际用到的 13 个文件，合计 0.83MB），
     彻底不再依赖 unpkg CDN —— 3D 页因此断网也能打开。
     升级 three 的做法：npm i three@版本 → 重新跑本地化脚本拷贝。
     注意：importmap 里必须是纯 JSON，不能写注释。 -->
<script type="importmap">
{ "imports": {
    "three": "assets/three/three.module.min.js",
    "three/addons/": "assets/three/addons/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>

<div class="hud" id="top">
  <div class="row" style="margin-bottom:6px">
    <span class="badge" id="bName">—</span>
    <span class="badge" id="bLv">Lv.1</span>
    <select class="btn" id="region"></select>
    <button class="btn gold" id="mapBtn">地图</button>
    <span style="flex:1"></span>
    <button class="btn" id="quality">高</button>
  </div>
  <div class="row" style="margin-bottom:5px">
    <span class="lbl">气血</span>
    <div class="barwrap"><div class="bar hp"><i id="hpBar"></i><em id="hpTxt"></em></div></div>
    <span class="lbl r">元神</span>
    <div class="barwrap"><div class="bar mp"><i id="mpBar"></i><em id="mpTxt"></em></div></div>
  </div>
</div>

<div id="fps"></div>

<div id="mapWrap">
  <div id="mapHead">
    <h3>舆图 · 灵界行记</h3>
    <span id="mapHint">点相邻且已解锁的节点即可前往</span>
    <span style="flex:1"></span>

</div>

<div id="encWrap">

    <div id="encTitle">奇遇</div>

</div>

<div class="hud" id="bottom">

  </div>

<script>
/* 发布号从入口 URL 取（index.html 的「3D 试炼场 · 进入」会带 ?v=发布号）。
   下面 data.js / core.js 与模块里的 GLB 模型都挂上它 —— 这样 3D 页整条资源链
   都不会命中上一版缓存，而发布号仍然只有 index.html 的 CUR 一个来源。
   用 document.write 是为了保持「先 data.js 再 core.js」的同步加载顺序。 */
var LX_V = '';
try { LX_V = new URLSearchParams(location.search).get('v') || ''; } catch (e) { }
var LX_Q = LX_V ? ('?v=' + encodeURIComponent(LX_V)) : '';
document.write('<script src="js/data.js' + LX_Q + '"><\/script>');
document.write('<script src="js/core.js' + LX_Q + '"><\/script>');
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================================
   3D 洞天 —— 与 2D 版共用同一个 core.js（它零 DOM 依赖，可直接在 3D 里跑）。
   所以这里不是"另一个游戏"：读的是同一份存档，涨的是同一份修为，
   境界/装备/技能/举剑/挂机全部生效，只是把表现层换成了实时 3D。
   ========================================================================== */

const G = window.Game;            /* core.js 暴露的游戏对象 */
const D = window.DATA || window.D || {};      /* data.js 挂在 window.DATA 上 */
const REGIONS = D.REGIONS || [];
const q = new URLSearchParams(location.search);
/* 工具：必须在任何使用之前定义（const 有 TDZ，放到后面会直接抛错） */
const el = id => document.getElementById(id);

/* ---------- 0. 起号 / 读档（与 2D 版共用 localStorage 存档） ---------- */
try {
  G.load();
} catch (e) { /* 存档损坏：当新号处理 */ }
if (!G.state || !G.state.sect) {
  const sect = q.get('sect') || (D.SECTS && D.SECTS[0] && D.SECTS[0].id) || 'qingyun';
  const gender = q.get('gender') || 'female';
  G.createCharacter(q.get('name') || '无名散修', sect, gender);
}
const SECT = G.sectOf(G.state.sect) || { name: '青云门', color: '#5eead4' };
const COL = new THREE.Color(SECT.color || '#5eead4');
document.documentElement.dataset.sect = G.state.sect;

/* ---------- 画质档位（性能第一步：先定上限，再谈效果） ---------- */
const TIERS = [
  { n: '低', dpr: 1.0, shadow: 0,    bloom: 0,    part: 70,  rock: 16, tree: 10, refine: false },
  { n: '中', dpr: 1.5, shadow: 1024, bloom: 0.3,  part: 150, rock: 26, tree: 18, refine: false },
  { n: '高', dpr: 2.0, shadow: 2048, bloom: 0.52, part: 280, rock: 34, tree: 26, refine: true }
];
let tier = Math.max(0, Math.min(2, parseInt(localStorage.getItem('zx3d_tier') || '2', 10) || 0));

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: tier >= 1, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
/* 曝光压到 0.88：模型本身是接近纯白的袍子，配上 Bloom 很容易糊成一团白光 */
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1220, 0.018);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 500);
camera.position.set(0, 5.4, 12.8);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.075, minDistance: 5.5,
  maxDistance: 30, minPolarAngle: 0.32, maxPolarAngle: Math.PI * 0.47,
  rotateSpeed: 0.55, zoomSpeed: 0.8, enablePan: false });
controls.target.set(0, 2.1, 0);

/* ---------- 1. 环境反射：RoomEnvironment 生成程序化 IBL（不需要 HDRI 素材） ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
function applyEnv() {
  const env = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
  if (scene.environment) scene.environment.dispose();
  scene.environment = env.texture;
  scene.environmentIntensity = tier === 0 ? 0.35 : (tier === 1 ? 0.5 : 0.62);
}
applyEnv();

/* ---------- 2. 程序化贴图（不引入任何外部图片资源） ---------- */
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = tier >= 1 ? 4 : 1;
  return t;
}
function texSize() { return tier === 0 ? 128 : (tier === 1 ? 192 : 256); }
let groundTex = null, rockTex = null, skyTex = null;
function buildTextures() {
  const S = texSize();
  groundTex = canvasTex(S, (g, s) => {
    g.fillStyle = '#1e2a1c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 12; i++) {
      const v = 0.7 + Math.random() * 0.55;
      g.fillStyle = 'rgba(' + ((46 * v) | 0) + ',' + ((68 * v) | 0) + ',' + ((40 * v) | 0) + ',' + (0.3 + Math.random() * 0.5) + ')';
      g.beginPath(); g.arc(Math.random() * s, Math.random() * s, 1 + Math.random() * 3, 0, 6.283); g.fill();
    }
  }, 20);
  rockTex = canvasTex(S, (g, s) => {
    g.fillStyle = '#4c525a'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 7; i++) {
      const v = 0.6 + Math.random() * 0.75;
      g.fillStyle = 'rgba(' + ((78 * v) | 0) + ',' + ((84 * v) | 0) + ',' + ((94 * v) | 0) + ',.5)';
      g.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 5, 2 + Math.random() * 4);
    }
  }, 2);
  skyTex = canvasTex(Math.max(256, S * 2), (g, s) => {
    const grd = g.createLinearGradient(0, 0, 0, s);
    grd.addColorStop(0, '#080e1c'); grd.addColorStop(0.42, '#132238');
    grd.addColorStop(0.74, '#2a3c50'); grd.addColorStop(1, '#46565f');
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 1.4; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.75) + ')';
      g.fillRect(Math.random() * s, Math.random() * s * 0.52, 1.2, 1.2);
    }
  });
}
buildTextures();
scene.background = skyTex;

/* ---------- 3. 光照：半球 + 主光（软阴影）+ 冷色轮廓光 + 施法动态点光 ---------- */
const hemi = new THREE.HemisphereLight(0x9ec9ff, 0x2b2c22, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6bd, 2.2);
sun.position.set(-9, 15, 8); sun.castShadow = true;
/* 阴影条纹（acne）：平面地面用很小的正 bias + 极小的 normalBias 就够；
   bias 调大反而会让阴影脱脚（peter-panning） */
sun.shadow.normalBias = 0.02; sun.shadow.bias = 0.0005;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6fd8ff, 0.9);
rim.position.set(8, 5, -12); scene.add(rim);
const master = new THREE.PointLight(0xffffff, 0, 30, 2);
master.position.set(0, 2.6, 0.4); scene.add(master);

/* ---------- 4. 地面 / 石台 / 装饰（InstancedMesh：几十个物件只占 2 次绘制） ---------- */
/* 地面用平面而不是大圆盘：CircleGeometry 是从圆心发散的三角扇，
   在几十米尺度上做阴影接收会出现放射状接缝（实测很明显）。平面只有 2 个三角形，没有这个问题。 */
const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150),
  new THREE.MeshStandardMaterial({ map: groundTex, color: 0x8f9e88, roughness: 0.95, metalness: 0.02 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const discMat = new THREE.MeshStandardMaterial({ map: rockTex, color: 0xa7aeb6, roughness: 0.76, metalness: 0.08 });
const disc = new THREE.Mesh(new THREE.CylinderGeometry(9.6, 10.4, 0.5, 64), discMat);
/* 石台不投影：它是个 64 面的圆柱，紧贴地面，每一条侧面都会在地面上拉出一道
   放射状阴影 —— 之前地面上那些"放射纹"就是它造成的，不是阴影参数问题。 */
disc.position.y = -0.25; disc.receiveShadow = true; disc.castShadow = false; scene.add(disc);
const ringEdge = new THREE.Mesh(new THREE.TorusGeometry(9.7, 0.13, 10, 96),
  new THREE.MeshStandardMaterial({ color: COL, emissive: COL, emissiveIntensity: 1.6, roughness: 0.35 }));
ringEdge.rotation.x = Math.PI / 2; ringEdge.position.y = 0.02; scene.add(ringEdge);

const rockMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ map: rockTex, roughness: 0.94, metalness: 0.04 }), 64);
const treeTrunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09, 0.15, 5.4, 6),
  new THREE.MeshStandardMaterial({ color: 0x4d5a36, roughness: 0.9 }), 40);
const treeLeaf = new THREE.InstancedMesh(new THREE.ConeGeometry(0.66, 1.5, 6),
  new THREE.MeshStandardMaterial({ color: 0x3d6a42, roughness: 0.86, side: THREE.DoubleSide }), 120);
[rockMesh, treeTrunk, treeLeaf].forEach(m => { m.castShadow = tier >= 1; m.receiveShadow = true; scene.add(m); });

/* ---------- 区域专属地形：八个区域各有各的"该长什么样" ----------
   同一套代码，靠一张风格表切换：植被用哪种、地面什么色、雾什么色、天上飘什么。
   新增的植被也都是 InstancedMesh，一个区域最多 4 个 draw call。 */
const TERRAIN = {
  r01: { tree: 'pine',   density: 1.0, ground: 0x8f9e88, fog: 0x0b1220, sun: 0xffe6bd, weather: '',      glow: 0 },
  r02: { tree: 'bamboo', density: 1.5, ground: 0x7f9a92, fog: 0x0a1a24, sun: 0xd8f0ff, weather: 'mist',  glow: 0 },
  r03: { tree: 'pillar', density: 0.9, ground: 0x4a4658, fog: 0x140f22, sun: 0xc9b6ff, weather: 'mote',  glow: 0 },
  r04: { tree: 'deadtree', density: 0.7, ground: 0x4a3830, fog: 0x1d0e08, sun: 0xffb066, weather: 'ember', glow: 1 },
  r05: { tree: 'deadtree', density: 1.1, ground: 0x4c5a44, fog: 0x0d1a12, sun: 0xcfe8b8, weather: 'mist',  glow: 0 },
  r06: { tree: 'pillar', density: 1.2, ground: 0x5c5068, fog: 0x1a0e20, sun: 0xffc9f2, weather: 'mote',  glow: 1 },
  r07: { tree: 'ice',    density: 1.3, ground: 0xa8bcc8, fog: 0x0d1a2c, sun: 0xdcefff, weather: 'snow',  glow: 0 },
  r08: { tree: 'sword',  density: 0.8, ground: 0x5a4046, fog: 0x200a0e, sun: 0xffb8b8, weather: 'ember', glow: 1 }
};
let terrain = TERRAIN.r01;
const POOL = 40;
function newInst(geo, color, rough, emissive, count) {
  const m = new THREE.InstancedMesh(geo,

function layoutProps(seed) {
  const T = TIERS[tier];

  const rand = () => (rnd = (rnd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 64; i++) {
    const used = i < T.rock;
    const a = rand() * Math.PI * 2, r = 11.5 + rand() * 24, s = 0.5 + rand() * 2.5;
    dummy.position.set(Math.cos(a) * r, used ? s * 0.42 : -900, Math.sin(a) * r);
    dummy.scale.set(s, s * (0.6 + rand() * 0.6), s);
    dummy.rotation.set(rand(), rand(), rand());
    dummy.updateMatrix();
    rockMesh.setMatrixAt(i, dummy.matrix);
  }

     InstancedMesh 的默认矩阵是单位矩阵，不藏就会在原点叠 40 棵 */
  for (let i = 0; i < 40; i++) {
    dummy.position.set(0, -900, 0); dummy.scale.setScalar(1); dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix(); treeTrunk.setMatrixAt(i, dummy.matrix);

  for (let i = 0; i < 120; i++) {
    dummy.position.set(0, -900, 0); dummy.scale.setScalar(1); dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix(); treeLeaf.setMatrixAt(i, dummy.matrix);
  }
  treeTrunk.instanceMatrix.needsUpdate = true;
  treeLeaf.instanceMatrix.needsUpdate = true;
  rockMesh.instanceMatrix.needsUpdate = true;

  /* 本区域该长什么：只铺风格表里那一种，其余整类藏到地下 */
  const want = terrain.tree || 'pine';
  const n = Math.round(T.tree * (terrain.density || 1));
  for (const k in kinds) {
    const K = kinds[k], on = k === want;
    for (let i = 0; i < POOL; i++) {
      const show = on && i < n;
      const a = rand() * Math.PI * 2, r = 13 + rand() * 22;
      const sc = 0.8 + rand() * 0.7;
      dummy.rotation.set(0, rand() * 6.28, 0);
      dummy.position.set(Math.cos(a) * r, show ? (K.ay || 2) * sc : -900, Math.sin(a) * r);
      dummy.scale.setScalar(sc);

      if (k === 'sword') {          /* 巨剑：剑格单摆 */

        dummy.rotation.set(0, rand() * 6.28, 0); dummy.scale.setScalar(sc);
        dummy.updateMatrix(); K.b.setMatrixAt(i, dummy.matrix);
        continue;

      for (let j = 0; j < K.bh; j++) {
        const li = i * K.bh + j;
        dummy.position.set(Math.cos(a) * r + (rand() - 0.5) * 0.5,
          show ? (K.by + j * 0.56) * sc : -900,
          Math.sin(a) * r + (rand() - 0.5) * 0.5);
        dummy.rotation.set(0, rand() * 6.28, (rand() - 0.5) * (k === 'pillar' ? 0.18 : 0.4));
        dummy.updateMatrix(); K.b.setMatrixAt(li, dummy.matrix);

  const c = new THREE.Vector3(); box2.getCenter(c);

function spawnParticles(pos, n, color, spread, up) {

    const a = Math.random() * Math.PI * 2, s = (0.6 + Math.random() * 1.6) * spread;
    pVel[k * 3] = Math.cos(a) * s;
    pVel[k * 3 + 1] = (up ? 1.6 : 0.4) + Math.random() * (up ? 3.2 : 1.2);
    pVel[k * 3 + 2] = Math.sin(a) * s;

    pCol[k * 3] = tmpCol.r * j; pCol[k * 3 + 1] = tmpCol.g * j; pCol[k * 3 + 2] = tmpCol.b * j;

function stepParticles(dt) {

    pVel[k * 3 + 1] -= 5.4 * dt;
    pPos[k * 3] += pVel[k * 3] * dt; pPos[k * 3 + 1] += pVel[k * 3 + 1] * dt; pPos[k * 3 + 2] += pVel[k * 3 + 2] * dt;

const rings = [];
const ringGeo = new THREE.RingGeometry(0.35, 0.5, 44);

    opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(pos.x, 0.07, pos.z); scene.add(m);

function stepRings(dt) {

    const r = rings[i]; r.t += dt;
    const k = Math.min(1, r.t / 0.55);
    r.m.scale.setScalar(0.4 + k * r.maxR);
    r.m.material.opacity = 0.9 * (1 - k);
    if (k >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); }

}

/* ---- 打击感三件套：伤害飘字 / 镜头震动 / 命中顿帧 ----

/* ---------- 7. 怪物同步：直接跟 core.js 的战斗上下文对齐 ---------- */
function mobPosOf(m) { return { x: -3.4 - (m.idx || 0) * 1.5, y: 0, z: (m.idx === 1 ? -2.1 : m.idx === 2 ? 2.1 : 0) }; }

  gr.userData.fallback = !mobTplReady;

  const next = mobTplReady ? mobTpl.clone(true) : buildFallbackMob('beast');
  if (old) gr.remove(old);
  gr.add(next);
}
function syncMobs() {
  const list = (G.combat && G.combat.mobs) || [];
  const alive = new Set();
  list.forEach(m => {
    if (!m || m.hp <= 0) return;
    alive.add(m.idx);
    let gr = mobMeshes.get(m.idx);
    if (!gr) {
      const kind = ['beast', 'demon', 'ghost'][m.idx % 3];
      gr = makeMob(kind);
      const p = mobPosOf(m);
      gr.position.set(p.x, 0, p.z);
      scene.add(gr);
      mobMeshes.set(m.idx, gr);
      addLog('妖物「' + ({ beast: '岩甲兽', demon: '血魇', ghost: '幽魄' }[kind]) + '」现身', '');
    }
    const p = mobPosOf(m);
    gr.position.x += (p.x - gr.position.x) * 0.06;
    gr.position.z += (p.z - gr.position.z) * 0.06;
  });
  mobMeshes.forEach((gr, idx) => {
    if (alive.has(idx) || gr.userData.dying) return;
    /* 不死得消失得太干脆：先倒地 + 下沉 + 落地震波，播完再移除 */
    gr.userData.dying = 0.001;
    spawnParticles(gr.position, 34, '#facc15', 2.4, true);
    shockwave(gr.position, '#facc15', 4.0);

  });
}
function mobAnchor(idx) {
  const gr = mobMeshes.get(idx);

}
/* 造一只怪：优先用 GLB（岩甲兽），其余用程序化形体。
   无论哪种，都在组级别挂一张贴地暗斑 —— 怪物必须"压在地上"才像活的。 */
function makeMob(kind) {
  const gr = new THREE.Group();
  let inner;
  if (mobTpls[kind]) {
    inner = mobTpls[kind].clone(true);
    inner.scale.multiplyScalar(MOB_SCALE[kind] || 0.7);
  } else {
    inner = buildFallbackMob(kind);
  }
  gr.add(inner);
  const sh = new THREE.Mesh(new THREE.CircleGeometry(1.0, 20),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.03; sh.scale.set(1.2, 0.8, 1);
  gr.add(sh);
  gr.userData.inner = inner; gr.userData.shadowBlob = sh; gr.userData.kind = kind;
  gr.userData.spring = 0; gr.userData.lunge = 0; gr.userData.recoil = 0;
  gr.userData.sway = Math.random() * 6.28;
  gr.scale.setScalar(0.01);
  return gr;
}
/* 每帧的怪物行为：出场弹起 → 面向主角 → 呼吸 → 扑击 → 受击后退 */
function updateMobs(dt, now) {
  const hp = heroRoot.position;
  mobMeshes.forEach((gr, idx) => {
    const u = gr.userData;
    /* 死亡：侧翻倒地 → 沉入地下 → 缩小移除（不是"啪"一下就不见） */
    if (u.dying) {
      u.dying += dt;
      const k = Math.min(1, u.dying / 0.78);
      gr.rotation.x = -k * 1.35;
      gr.rotation.z = k * 0.22;
      gr.position.y = -k * 1.15;
      gr.scale.setScalar(Math.max(0.001, 1 - k * 0.4));
      if (u.shadowBlob) u.shadowBlob.material.opacity = 0.4 * (1 - k);
      if (k >= 1) { scene.remove(gr); mobMeshes.delete(idx); }
      return;
    }
    u.spring = Math.min(1, u.spring + dt * 2.4);
    const s = u.spring * u.spring * (3 - 2 * u.spring);           /* smoothstep 弹出 */
    gr.scale.setScalar(s);
    const breathe = Math.sin(now * 0.0026 + u.sway) * 0.04;
    const float = u.kind === 'ghost' ? Math.sin(now * 0.0019 + u.sway) * 0.15 + 0.22 : 0;
    gr.position.y = breathe + float;
    /* 面向主角（不面向玩家的妖物看起来就是道具） */
    const tgt = Math.atan2(hp.x - gr.position.x, hp.z - gr.position.z);
    let d = tgt - gr.rotation.y;
    while (d > Math.PI) d -= 6.2832;
    while (d < -Math.PI) d += 6.2832;
    gr.rotation.y += d * Math.min(1, dt * 4.5);
    /* 抬头 / 低头：扑击时猛探，平时轻微呼吸 */
    const head = u.inner && u.inner.userData && u.inner.userData.head;
    if (head) head.rotation.z = Math.sin(now * 0.0022 + u.sway) * 0.07 - u.lunge * 0.6;
    if (u.lunge > 0) {
      u.lunge = Math.max(0, u.lunge - dt / 0.36);
      const k = Math.sin(u.lunge * Math.PI);
      gr.position.x += Math.sin(gr.rotation.y) * k * 1.35 * dt * 6;
      gr.position.z += Math.cos(gr.rotation.y) * k * 1.35 * dt * 6;
      gr.rotation.x = -k * 0.22;
    } else gr.rotation.x *= 0.86;
    if (u.recoil > 0) {
      u.recoil = Math.max(0, u.recoil - dt / 0.22);
      gr.position.x -= Math.sin(gr.rotation.y) * u.recoil * 0.9;
      gr.rotation.x = u.recoil * 0.16;
    }
    if (u.shadowBlob) u.shadowBlob.material.opacity = 0.4 * s;
  });
}

/* ---------- 8. 姿态：核心是"把剑举起来"再劈下去 ---------- */
const pose = { arm: 0, armT: 0, swing: 0, hit: 0 };
function applyPose(dt) {
  const idle = Math.sin(performance.now() * 0.0016) * 0.03;
  heroRoot.position.y = idle;
  pose.arm += (pose.armT - pose.arm) * Math.min(1, dt * 8);
  const hold = G.raiseOn && G.raiseOn() ? 1 : 0;
  if (hold) pose.armT = 1; else if (pose.armT > 0.9) pose.armT = 0;
  const lift = Math.max(pose.arm, hold);
  const tgt = heroPivot || heroFallback;
  if (tgt) {
    /* 举剑：整体上提 + 前倾（GLB 是单体网格，剑与身同体，所以抬的是整个人） */
    heroRoot.rotation.z = lift * 0.06 - pose.swing * 0.16 + (pose.hit > 0 ? -0.2 * (pose.hit / 0.3) : 0);
    heroRoot.rotation.x = -pose.swing * 0.1;
    heroRoot.position.y += lift * 0.14 - pose.swing * 0.06;
    heroRoot.rotation.y = -0.95 + (hold ? -0.12 : 0);
  }
  if (pose.swing > 0) pose.swing = Math.max(0, pose.swing - dt / 0.24);
  if (pose.hit > 0) pose.hit -= dt;
  /* 走位：真的"走"过去 —— 前倾 + 上下起伏 + 轻微左右摆，比瞬间换场景可信 */
  if (walking > 0) {
    walking -= dt;
    const k = Math.min(1, walking / 0.9);
    const step = Math.sin((0.9 - walking) * 16);
    heroRoot.rotation.x = -0.18 * k;
    heroRoot.position.y += Math.abs(step) * 0.09 * k;
    heroRoot.rotation.z += step * 0.05 * k;
    heroRoot.position.x += 0.5 * dt * k;
    if (walking <= 0) heroRoot.position.x = 2.6;
  }
}

  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), T.bloom, 0.58, 0.92);

const NODE_ENC = {
  n01: [['e_old', 6], ['e_bandit', 5], ['e_herb', 7]],
  n02: [['e_herb', 9], ['e_bamboo', 5]],
  n03: [['e_spring', 6], ['e_bamboo', 4]],
  n04: [['e_bat', 7], ['e_forge', 3]],
  n05: [['e_spring', 6], ['e_spirit', 4]],
  n06: [['e_fire', 7], ['e_forge', 4]],
  n07: [['e_swamp', 6], ['e_lotus', 5]],
  n08: [['e_altar', 5], ['e_nuwa', 2]],
  n09: [['e_swamp', 5], ['e_lotus', 6]],
  n10: [['e_peak', 5], ['e_ice', 6]],
  n11: [['e_sword', 5], ['e_ghost', 4]],
  n12: [['e_array', 4], ['e_zuxian', 1]]
};
const MAP_KEY = 'zx_map_v1';
let MAP = { at: 'n01', found: { n01: 1 } };
try { const raw = localStorage.getItem(MAP_KEY); if (raw) MAP = JSON.parse(raw); } catch (e) { }
function saveMap() { try { localStorage.setItem(MAP_KEY, JSON.stringify(MAP)); } catch (e) { } }
const nodeOf = id => NODES.find(n => n.id === id);
const hereNode = () => nodeOf(MAP.at) || NODES[0];

function renderMap() {
  const body = el('mapBody');
  const w = body.clientWidth, h = body.clientHeight;
  const svg = el('mapSvg');
  let path = '';
  NODES.forEach(n => n.links.forEach(l => {
    if (l < n.id) return;                                  /* 每条连线只画一次 */
    const m = nodeOf(l);
    path += '<line x1="' + (n.x / 100 * w) + '" y1="' + (n.y / 100 * h) + '" x2="' + (m.x / 100 * w) +
      '" y2="' + (m.y / 100 * h) + '" stroke="rgba(148,163,184,.35)" stroke-width="1.5" stroke-dasharray="4 5"/>';
  }));
  svg.innerHTML = path;
  [...body.querySelectorAll('.node')].forEach(d => d.remove());
  NODES.forEach(n => {
    const known = !!MAP.found[n.id];
    const reach = hereNode().links.indexOf(n.id) >= 0;
    const lock = G.state.level < n.lv;
    const d = document.createElement('div');
    d.className = 'node' + (MAP.at === n.id ? ' here' : '')
      + (known ? ' found' : ' known') + (lock ? ' lock' : '');
    d.style.left = n.x + '%'; d.style.top = n.y + '%';
    d.innerHTML = '<div class="dot" style="border-color:' + (MAP.at === n.id ? '#facc15'
      : (known ? 'rgba(94,234,212,.75)' : 'rgba(255,255,255,.35)')) + '"></div>' +
      '<div class="nm" style="color:' + (known ? '#d6d3d1' : '#a8a29e') + '">' +
      (known || reach ? n.name : '？？？') + '</div>' +
      '<div class="lv">Lv.' + n.lv + (lock ? ' · 未达' : '') + '</div>';
    if (!lock && reach && MAP.at !== n.id) {
      d.addEventListener('click', () => travel(n.id));
    }
    body.appendChild(d);
  });
}
function travel(id) {
  const n = nodeOf(id);
  if (!n) return;
  MAP.at = id; MAP.found[id] = 1; saveMap();
  el('mapWrap').classList.remove('on');
  regionSel.value = n.region;
  Game.switchRegion && Game.switchRegion(n.region, false);
  applyRegion(n.region);
  /* 走位：主角转身向前走两步（3D 里真的"走"过去，而不是换个贴图） */
  walking = 0.9;
  addLog('前往「' + n.name + '」', 'sk');
  toast(n.name, SECT.color);
  renderMap();
  if (Math.random() < 0.55) setTimeout(() => rollEncounter(id), 900);
}
/* 加权抽一个奇遇 */
function rollEncounter(nodeId) {
  const tbl = NODE_ENC[nodeId] || [];
  if (!tbl.length) return;
  let total = 0;
  tbl.forEach(([, w]) => { total += w; });
  let r = Math.random() * total, pick = tbl[0][0];
  for (let i = 0; i < tbl.length; i++) { r -= tbl[i][1]; if (r <= 0) { pick = tbl[i][0]; break; } }
  openEnc(pick);
}
let encOpen = '';
function openEnc(id) {
  const e = ENC[id];
  if (!e) return;
  encOpen = id;
  el('encTitle').textContent = e.t;
  el('encText').textContent = e.d;
  const box = el('encChoices');
  box.innerHTML = '';
  e.c.forEach((c, i) => {
    const cost = c.cost && c.cost.gold ? ('花费 ' + c.cost.gold + ' 灵石') : '';
    const gain = [];
    if (c.gain && c.gain.gold) gain.push('+' + c.gain.gold + ' 灵石');
    if (c.gain && c.gain.exp) gain.push('+' + c.gain.exp + ' 修为');
    const b = document.createElement('button');
    b.className = 'encChoice';
    b.innerHTML = c.t + '<br><em>' + [cost, gain.join(' · ')].filter(Boolean).join(' · ') + '</em>';
    b.addEventListener('click', () => pickChoice(c));
    box.appendChild(b);
  });
  el('encWrap').classList.add('on');
}
function pickChoice(c) {
  const s = G.state;
  if (c.cost && c.cost.gold && s.gold < c.cost.gold) { toast('灵石不足', '#fca5a5'); return; }
  if (c.cost && c.cost.gold) s.gold -= c.cost.gold;
  const got = [];
  if (c.gain && c.gain.gold) { s.gold += c.gain.gold; got.push('+' + c.gain.gold + ' 灵石'); }
  if (c.gain && c.gain.exp) { s.exp += c.gain.exp; got.push('+' + c.gain.exp + ' 修为'); }
  const title = (ENC[encOpen] || {}).t || '';
  el('encWrap').classList.remove('on');
  encOpen = '';
  addLog('奇遇「' + title + '」——' + got.join('，'), 'sk');
  toast(got.join('  '), '#facc15');
  spawnParticles(heroRoot.position, 30, '#facc15', 1.6, true);
  flash(0xffe6bd, 12, 260);
  try { G.save && G.save(); } catch (e) { }
}
let walking = 0, idleEncT = 60;
function idleEncounter(dt) {
  if (!G.state.auto || encOpen) return;
  idleEncT -= dt;
  if (idleEncT > 0) return;
  idleEncT = 100 + Math.random() * 90;                     /* 约 1.5~3 分钟一次 */
  if (Math.random() < 0.34) rollEncounter(MAP.at);
}
el('mapBtn').addEventListener('click', () => { el('mapWrap').classList.add('on'); renderMap(); });
el('mapClose').addEventListener('click', () => el('mapWrap').classList.remove('on'));
addEventListener('resize', () => { if (el('mapWrap').classList.contains('on')) renderMap(); });

/* ---------- 14. 主循环：Game.tick 驱动真实战斗，本页只负责表现 ---------- */
let last = performance.now(), acc = 0, frames = 0, low = 0;
function loop(now) {
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  /* 顿帧：命中那一瞬把时间放慢一档 —— 最便宜的打击感，比加特效有效 */
  if (freeze > 0) { freeze -= dt; dt *= 0.34; }
  if (G.tick) G.tick(dt);            /* ← 真实战斗逻辑（境界/装备/技能/举剑都在里面） */
  syncMobs();
  applyPose(dt);
  stepParticles(dt);
  stepRings(dt);
  hud(dt);
  updateMobs(dt, now);
  stepWeather(dt);
  idleEncounter(dt);
  const cx = mobMeshes.size ? [...mobMeshes.values()].reduce((a, g) => a + g.position.x, 0) / mobMeshes.size : heroRoot.position.x;
  controls.target.lerp(new THREE.Vector3((heroRoot.position.x + cx) * 0.32, 2.05, 0), 0.035);
  controls.update();
  master.position.set(heroRoot.position.x - 0.3, 2.6, 0.5);
  /* 镜头震动作用在世界上（动 scene，不动 camera）—— 动 camera 会和 OrbitControls 抢控制权 */
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.0);
    scene.position.set((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake * 0.8, 0);
  } else if (scene.position.x || scene.position.y) scene.position.set(0, 0, 0);
  if (composer) composer.render(); else renderer.render(scene, camera);

  frames++; acc += dt;
  if (acc >= 0.6) {
    const fps = frames / acc; frames = 0; acc = 0;
    el('fps').textContent = Math.round(fps) + ' FPS\n' + TIERS[tier].n + '档' + (composer ? ' · Bloom' : '');
    if (fps < 42 && tier > 0) { if (++low >= 3) { low = 0; tier--; applyTier(); addLog('帧率偏低 → 自动降到「' + TIERS[tier].n + '」', ''); } }
    else low = 0;
  }
  requestAnimationFrame(loop);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 56 : 46;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
}
addEventListener('resize', resize);
resize();
setTimeout(() => { el('loading').classList.add('done');
  addLog('拖动画布环视 · 点「开战」开始挂机', 'sk');
  if (G.state.auto) el('hint').style.opacity = '0'; }, 500);
requestAnimationFrame(loop);
