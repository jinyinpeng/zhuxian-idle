<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>诛仙问道 · 3D 洞天</title>
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#06080c;
    font:13px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; color:#e7e5e4; }
  #stage { position:fixed; inset:0; display:block; touch-action:none; }
  .hud { position:fixed; left:0; right:0; z-index:5; pointer-events:none; }
  #top { top:0; padding:calc(8px + env(safe-area-inset-top)) 12px 0; }
  .row { display:flex; align-items:center; gap:7px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(10,14,20,.62);
    border:1px solid rgba(250,204,21,.35); color:#facc15; letter-spacing:.06em; white-space:nowrap; }
  .bar { position:relative; height:9px; border-radius:999px; overflow:hidden; flex:1;
    background:rgba(8,12,18,.72); border:1px solid rgba(255,255,255,.14); }
  .bar > i { position:absolute; inset:0; transform-origin:left center; transition:transform .16s linear; }
  .bar.hp > i { background:linear-gradient(90deg,#f87171,#ef4444); }
  .bar.mp > i { background:linear-gradient(90deg,#38bdf8,#0ea5e9); }
  .bar em { position:absolute; inset:0; text-align:center; font:10px/9px system-ui; font-style:normal;
    color:#fff; text-shadow:0 1px 2px #000; }
  .barwrap { width:min(40vw,230px); }
  .lbl { font-size:11px; color:#a8a29e; width:22px; }
  .lbl.r { text-align:right; }
  #bottom { bottom:0; padding:0 12px calc(10px + env(safe-area-inset-bottom)); display:flex;
    justify-content:space-between; align-items:flex-end; gap:10px; }
  .panel { pointer-events:auto; background:rgba(10,14,20,.6); border:1px solid rgba(255,255,255,.13);
    border-radius:12px; padding:8px 10px; backdrop-filter:blur(6px); }
  #log { width:min(44vw,320px); max-height:104px; overflow:hidden; font-size:11.5px; color:#d6d3d1; }
  #log b { color:#facc15; } #log .hit { color:#fca5a5; } #log .sk { color:#7dd3fc; }
  #toast { position:fixed; left:50%; top:32%; transform:translate(-50%,-50%) scale(.9); z-index:6;
    font:700 22px/1.3 system-ui; color:#facc15; text-shadow:0 2px 14px rgba(250,204,21,.55),0 2px 4px #000;
    opacity:0; transition:opacity .16s,transform .16s; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  .btn { pointer-events:auto; border:1px solid rgba(255,255,255,.16); background:rgba(10,14,20,.6);
    color:#e7e5e4; border-radius:10px; padding:7px 11px; font-size:12px; white-space:nowrap; }
  .btn.gold { border-color:rgba(250,204,21,.5); color:#facc15; }
  select.btn { padding:6px 8px; }
  #fps { position:fixed; right:10px; top:calc(48px + env(safe-area-inset-top)); z-index:6;
    font:11px/1.45 ui-monospace,monospace; color:#a8a29e; text-align:right; white-space:pre; }
  #hint { position:fixed; left:50%; bottom:calc(74px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    z-index:5; font-size:11px; color:#a8a29e; background:rgba(10,14,20,.5); padding:4px 10px;
    border-radius:999px; transition:opacity .4s; }
  #loading { position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:12px; background:#06080c; transition:opacity .6s; }
  #loading.done { opacity:0; pointer-events:none; }
  .ring { width:44px; height:44px; border-radius:50%; border:3px solid rgba(250,204,21,.2);
    border-top-color:#facc15; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #ltxt { color:#a8a29e; font-size:12px; } #lsub { color:#57534e; font-size:11px; }
</style>
<script type="importmap">

<body>
<canvas id="stage"></canvas>

<div class="hud" id="top">
  <div class="row" style="margin-bottom:6px">
    <span class="badge" id="bName">—</span>
    <span class="badge" id="bLv">Lv.1</span>
    <select class="btn" id="region"></select>
    <span style="flex:1"></span>
    <button class="btn" id="quality">高</button>
  </div>
  <div class="row" style="margin-bottom:5px">
    <span class="lbl">气血</span>
    <div class="barwrap"><div class="bar hp"><i id="hpBar"></i><em id="hpTxt"></em></div></div>
    <span class="lbl r">元神</span>
    <div class="barwrap"><div class="bar mp"><i id="mpBar"></i><em id="mpTxt"></em></div></div>
  </div>
</div>

<div id="fps"></div>

<div class="hud" id="bottom">
  <div class="panel" id="log"></div>
  <div style="display:flex;gap:8px;align-items:flex-end">
    <button class="btn" id="back2d">2D</button>
    <button class="btn gold" id="fight">开战</button>
  </div>
</div>

<div id="loading"><div class="ring"></div><div id="ltxt">正在构筑洞天…</div><div id="lsub"></div></div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

/* ============================================================================
   3D 洞天 —— 与 2D 版共用同一个 core.js（它零 DOM 依赖，可直接在 3D 里跑）。
   所以这里不是"另一个游戏"：读的是同一份存档，涨的是同一份修为，
   境界/装备/技能/举剑/挂机全部生效，只是把表现层换成了实时 3D。
   ========================================================================== */

const G = window.Game;            /* core.js 暴露的游戏对象 */
const D = window.DATA || window.D || {};      /* data.js 挂在 window.DATA 上 */
const REGIONS = D.REGIONS || [];
const q = new URLSearchParams(location.search);
/* 工具：必须在任何使用之前定义（const 有 TDZ，放到后面会直接抛错） */
const el = id => document.getElementById(id);

/* ---------- 0. 起号 / 读档（与 2D 版共用 localStorage 存档） ---------- */
try {
  G.load();
} catch (e) { /* 存档损坏：当新号处理 */ }
if (!G.state || !G.state.sect) {
  const sect = q.get('sect') || (D.SECTS && D.SECTS[0] && D.SECTS[0].id) || 'qingyun';
  const gender = q.get('gender') || 'female';
  G.createCharacter(q.get('name') || '无名散修', sect, gender);
}
const SECT = G.sectOf(G.state.sect) || { name: '青云门', color: '#5eead4' };
const COL = new THREE.Color(SECT.color || '#5eead4');
document.documentElement.dataset.sect = G.state.sect;

/* ---------- 画质档位（性能第一步：先定上限，再谈效果） ---------- */
const TIERS = [
  { n: '低', dpr: 1.0, shadow: 0,    bloom: 0,    part: 70,  rock: 16, tree: 10, refine: false },
  { n: '中', dpr: 1.5, shadow: 1024, bloom: 0.3,  part: 150, rock: 26, tree: 18, refine: false },
  { n: '高', dpr: 2.0, shadow: 2048, bloom: 0.52, part: 280, rock: 34, tree: 26, refine: true }
];
let tier = Math.max(0, Math.min(2, parseInt(localStorage.getItem('zx3d_tier') || '2', 10) || 0));

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: tier >= 1, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
/* 曝光压到 0.88：模型本身是接近纯白的袍子，配上 Bloom 很容易糊成一团白光 */
renderer.toneMappingExposure = 0.88;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1220, 0.018);
const camera = new THREE.PerspectiveCamera(46, 1, 0.1, 500);
camera.position.set(0, 5.4, 12.8);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping: true, dampingFactor: 0.075, minDistance: 5.5,
  maxDistance: 30, minPolarAngle: 0.32, maxPolarAngle: Math.PI * 0.47,
  rotateSpeed: 0.55, zoomSpeed: 0.8, enablePan: false });
controls.target.set(0, 2.1, 0);

/* ---------- 1. 环境反射：RoomEnvironment 生成程序化 IBL（不需要 HDRI 素材） ---------- */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
function applyEnv() {
  const env = pmrem.fromScene(new RoomEnvironment(renderer), 0.04);
  if (scene.environment) scene.environment.dispose();
  scene.environment = env.texture;
  scene.environmentIntensity = tier === 0 ? 0.35 : (tier === 1 ? 0.5 : 0.62);
}
applyEnv();

/* ---------- 2. 程序化贴图（不引入任何外部图片资源） ---------- */
function canvasTex(size, draw, repeat) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (repeat) t.repeat.set(repeat, repeat);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = tier >= 1 ? 4 : 1;
  return t;
}
function texSize() { return tier === 0 ? 128 : (tier === 1 ? 192 : 256); }
let groundTex = null, rockTex = null, skyTex = null;
function buildTextures() {
  const S = texSize();
  groundTex = canvasTex(S, (g, s) => {
    g.fillStyle = '#1e2a1c'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 12; i++) {
      const v = 0.7 + Math.random() * 0.55;
      g.fillStyle = 'rgba(' + ((46 * v) | 0) + ',' + ((68 * v) | 0) + ',' + ((40 * v) | 0) + ',' + (0.3 + Math.random() * 0.5) + ')';
      g.beginPath(); g.arc(Math.random() * s, Math.random() * s, 1 + Math.random() * 3, 0, 6.283); g.fill();
    }
  }, 20);
  rockTex = canvasTex(S, (g, s) => {
    g.fillStyle = '#4c525a'; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 7; i++) {
      const v = 0.6 + Math.random() * 0.75;
      g.fillStyle = 'rgba(' + ((78 * v) | 0) + ',' + ((84 * v) | 0) + ',' + ((94 * v) | 0) + ',.5)';
      g.fillRect(Math.random() * s, Math.random() * s, 2 + Math.random() * 5, 2 + Math.random() * 4);
    }
  }, 2);
  skyTex = canvasTex(Math.max(256, S * 2), (g, s) => {
    const grd = g.createLinearGradient(0, 0, 0, s);
    grd.addColorStop(0, '#080e1c'); grd.addColorStop(0.42, '#132238');
    grd.addColorStop(0.74, '#2a3c50'); grd.addColorStop(1, '#46565f');
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    for (let i = 0; i < s * 1.4; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.75) + ')';
      g.fillRect(Math.random() * s, Math.random() * s * 0.52, 1.2, 1.2);
    }
  });
}
buildTextures();
scene.background = skyTex;

/* ---------- 3. 光照：半球 + 主光（软阴影）+ 冷色轮廓光 + 施法动态点光 ---------- */
const hemi = new THREE.HemisphereLight(0x9ec9ff, 0x2b2c22, 0.62);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6bd, 2.2);
sun.position.set(-9, 15, 8); sun.castShadow = true;
/* 阴影条纹（acne）：靠 normalBias 消除，而不是靠调大 bias —— 后者会让阴影脱脚 */
sun.shadow.normalBias = 0.075; sun.shadow.bias = -0.0004;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x6fd8ff, 0.9);
rim.position.set(8, 5, -12); scene.add(rim);
const master = new THREE.PointLight(0xffffff, 0, 30, 2);
master.position.set(0, 2.6, 0.4); scene.add(master);

/* ---------- 4. 地面 / 石台 / 装饰（InstancedMesh：几十个物件只占 2 次绘制） ---------- */
const ground = new THREE.Mesh(new THREE.CircleGeometry(52, 64),
  new THREE.MeshStandardMaterial({ map: groundTex, color: 0x8f9e88, roughness: 0.95, metalness: 0.02 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const discMat = new THREE.MeshStandardMaterial({ map: rockTex, color: 0xa7aeb6, roughness: 0.76, metalness: 0.08 });
const disc = new THREE.Mesh(new THREE.CylinderGeometry(9.6, 10.4, 0.5, 64), discMat);
disc.position.y = -0.25; disc.receiveShadow = true; disc.castShadow = tier >= 1; scene.add(disc);
const ringEdge = new THREE.Mesh(new THREE.TorusGeometry(9.7, 0.13, 10, 96),
  new THREE.MeshStandardMaterial({ color: COL, emissive: COL, emissiveIntensity: 1.6, roughness: 0.35 }));
ringEdge.rotation.x = Math.PI / 2; ringEdge.position.y = 0.02; scene.add(ringEdge);

const rockMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 0),
  new THREE.MeshStandardMaterial({ map: rockTex, roughness: 0.94, metalness: 0.04 }), 64);
const treeTrunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.09, 0.15, 5.4, 6),
  new THREE.MeshStandardMaterial({ color: 0x4d5a36, roughness: 0.9 }), 40);
const treeLeaf = new THREE.InstancedMesh(new THREE.ConeGeometry(0.66, 1.5, 6),
  new THREE.MeshStandardMaterial({ color: 0x3d6a42, roughness: 0.86, side: THREE.DoubleSide }), 120);
[rockMesh, treeTrunk, treeLeaf].forEach(m => { m.castShadow = tier >= 1; m.receiveShadow = true; scene.add(m); });

const dummy = new THREE.Object3D();
function layoutProps(seed) {
  const T = TIERS[tier];
  let rnd = seed || 1;
  const rand = () => (rnd = (rnd * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < 64; i++) {
    const used = i < T.rock;
    const a = rand() * Math.PI * 2, r = 11.5 + rand() * 24, s = 0.5 + rand() * 2.5;
    dummy.position.set(Math.cos(a) * r, used ? s * 0.42 : -900, Math.sin(a) * r);
    dummy.scale.set(s, s * (0.6 + rand() * 0.6), s);
    dummy.rotation.set(rand(), rand(), rand());
    dummy.updateMatrix();
    rockMesh.setMatrixAt(i, dummy.matrix);
  }
  for (let i = 0; i < 40; i++) {
    const show = i < T.tree;
    const a = rand() * Math.PI * 2, r = 13 + rand() * 21;
    dummy.position.set(Math.cos(a) * r, show ? 2.7 : -900, Math.sin(a) * r);
    dummy.scale.setScalar(0.8 + rand() * 0.7);
    dummy.rotation.set(0, rand() * 6.28, 0);
    dummy.updateMatrix(); treeTrunk.setMatrixAt(i, dummy.matrix);
    for (let k = 0; k < 3; k++) {
      const li = i * 3 + k;
      dummy.position.set(Math.cos(a) * r + (rand() - 0.5) * 0.5, show ? 4.5 + k * 0.56 : -900, Math.sin(a) * r + (rand() - 0.5) * 0.5);
      dummy.rotation.set(0, rand() * 6.28, (rand() - 0.5) * 0.4);
      dummy.updateMatrix(); treeLeaf.setMatrixAt(li, dummy.matrix);
    }
  }
  rockMesh.instanceMatrix.needsUpdate = true;
  treeTrunk.instanceMatrix.needsUpdate = true;
  treeLeaf.instanceMatrix.needsUpdate = true;
}
layoutProps(20260926);

/* ---------- 5. 角色：GLB 模型（后台加载）+ 程序化低模兜底 ---------- */
const characters = new THREE.Group();
scene.add(characters);
const heroRoot = new THREE.Group();
heroRoot.position.set(2.6, 0, 0);
heroRoot.rotation.y = -0.95;
characters.add(heroRoot);
let heroModel = null, heroFallback = null, heroPivot = null;

function standardize(root, targetH) {
  const box = new THREE.Box3().setFromObject(root);
  const size = new THREE.Vector3(); box.getSize(size);
  const k = targetH / (size.y || 1);
  root.scale.setScalar(k);
  const box2 = new THREE.Box3().setFromObject(root);
  root.position.y -= box2.min.y;                      /* 脚踩地面 */
  const c = new THREE.Vector3(); box2.getCenter(c);
  root.position.x -= c.x; root.position.z -= c.z;     /* 居中到原点 */
  root.traverse(o => { if (o.isMesh) { o.castShadow = tier >= 1; o.receiveShadow = true;
    if (o.material) { o.material.envMapIntensity = 0.5; } } });
}
function buildFallbackHero() {
  const g = new THREE.Group();
  const robe = new THREE.MeshStandardMaterial({ color: 0xf4f2ec, roughness: 0.72 });
  const trim = new THREE.MeshStandardMaterial({ color: COL, roughness: 0.4, metalness: 0.2, emissive: COL, emissiveIntensity: 0.5 });
  const skin = new THREE.MeshStandardMaterial({ color: 0xf0d9c2, roughness: 0.78 });
  const hair = new THREE.MeshStandardMaterial({ color: 0xeae7e0, roughness: 0.74 });
  const parts = [
    [new THREE.CylinderGeometry(0.5, 0.95, 2.5, 16), robe, 0, 1.55, 0],
    [new THREE.CapsuleGeometry(0.44, 0.3, 4, 12), robe, 0, 2.88, 0],
    [new THREE.SphereGeometry(0.35, 20, 16), skin, 0, 3.35, 0],
    [new THREE.SphereGeometry(0.3, 16, 12), hair, 0, 3.62, -0.06],
    [new THREE.CapsuleGeometry(0.13, 1.0, 4, 10), hair, 0, 2.9, -0.42],
    [new THREE.CapsuleGeometry(0.15, 0.78, 4, 10), robe, 0.6, 2.42, 0],
    [new THREE.CapsuleGeometry(0.15, 0.78, 4, 10), robe, -0.6, 2.42, 0],
    [new THREE.BoxGeometry(1.16, 0.2, 0.72), trim, 0, 1.95, 0]
  ];
  parts.forEach(([geo, m, x, y, z]) => {
    const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = tier >= 1; g.add(o);
  });
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.5, 0.03),
    new THREE.MeshStandardMaterial({ color: 0x9ef3e4, emissive: COL, emissiveIntensity: 1.4,
      roughness: 0.2, metalness: 0.4, transparent: true, opacity: 0.95 }));
  blade.position.set(-0.8, 3.3, 0.06); blade.rotation.z = 0.16; blade.castShadow = tier >= 1;
  g.add(blade);
  return g;
}
heroFallback = buildFallbackHero();
heroRoot.add(heroFallback);

let mobTpl = null, mobTplReady = false;
const mobMeshes = new Map();
const mobColors = { beast: 0x6b4a2e, demon: 0x6d2545, ghost: 0x9fd8d0 };
function buildFallbackMob(kind) {
  const g = new THREE.Group();
  const col = mobColors[kind] || mobColors.beast;
  const m = new THREE.MeshStandardMaterial({ color: col, roughness: 0.82, flatShading: true });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.62, 1.05, 6, 14), m);
  body.rotation.z = Math.PI / 2; body.position.y = 1.15; body.castShadow = tier >= 1; g.add(body);
  const head = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5, 1), m);
  head.position.set(-0.98, 1.42, 0); head.castShadow = tier >= 1; g.add(head);
  const eyeM = new THREE.MeshStandardMaterial({ color: 0xff5a5a, emissive: 0xff2d2d, emissiveIntensity: 2.6 });
  [-0.2, 0.2].forEach(z => { const e = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 8), eyeM);
    e.position.set(-1.34, 1.5, z); g.add(e); });
  for (let i = 0; i < 4; i++) {
    const leg = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.62, 4, 8),
      new THREE.MeshStandardMaterial({ color: 0x2a2622, roughness: 0.86 }));
    leg.position.set(-0.6 + (i % 2) * 1.2, 0.42, i < 2 ? 0.4 : -0.4);
    leg.castShadow = tier >= 1; g.add(leg);
  }
  return g;
}

/* GLB 后台加载：加载完再换上去，绝不阻塞首屏（模型 30MB，中端机上要慢慢来） */
const loader = new GLTFLoader();
function loadGLB(url, onOk) {
  loader.load(url, gltf => { try { onOk(gltf.scene); } catch (e) { } },
    xhr => { if (xhr.total) el('lsub').textContent = '模型 ' + Math.round(xhr.loaded / xhr.total * 100) + '%'; },
    () => { el('lsub').textContent = ''; });
}
el('ltxt').textContent = '正在构筑洞天…';
loadGLB('assets/models/hero_cultivator.glb?v=' + (window.__VER || ''), scene2 => {
  standardize(scene2, 3.55);
  heroPivot = new THREE.Group();
  heroPivot.add(scene2);
  heroRoot.add(heroPivot);
  if (heroFallback) heroRoot.remove(heroFallback);
  heroModel = heroPivot;
  el('lsub').textContent = '主角模型已载入';
  setTimeout(() => { el('lsub').textContent = ''; }, 1600);
});
loadGLB('assets/models/beast.glb', scene2 => {
  standardize(scene2, 1.9);
  mobTpl = scene2; mobTplReady = true;
  [...mobMeshes.values()].forEach(gr => { if (gr.userData.fallback) rebuildMob(gr); });
});

/* ---------- 6. 粒子 / 冲击波 ---------- */
const PMAX = 320;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PMAX * 3), pCol = new Float32Array(PMAX * 3);
const pVel = new Float32Array(PMAX * 3), pLife = new Float32Array(PMAX);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
const points = new THREE.Points(pGeo, new THREE.PointsMaterial({ size: 0.26, vertexColors: true,
  transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false }));
points.frustumCulled = false; scene.add(points);
let pHead = 0;
const tmpCol = new THREE.Color();
function spawnParticles(pos, n, color, spread, up) {
  n = Math.min(n, TIERS[tier].part);
  tmpCol.set(color);
  for (let i = 0; i < n; i++) {
    const k = pHead = (pHead + 1) % PMAX;
    pPos[k * 3] = pos.x; pPos[k * 3 + 1] = pos.y + 1.2; pPos[k * 3 + 2] = pos.z;
    const a = Math.random() * Math.PI * 2, s = (0.6 + Math.random() * 1.6) * spread;
    pVel[k * 3] = Math.cos(a) * s;
    pVel[k * 3 + 1] = (up ? 1.6 : 0.4) + Math.random() * (up ? 3.2 : 1.2);
    pVel[k * 3 + 2] = Math.sin(a) * s;
    const j = 0.8 + Math.random() * 0.5;
    pCol[k * 3] = tmpCol.r * j; pCol[k * 3 + 1] = tmpCol.g * j; pCol[k * 3 + 2] = tmpCol.b * j;
    pLife[k] = 0.55 + Math.random() * 0.6;
  }
}
function stepParticles(dt) {
  for (let k = 0; k < PMAX; k++) {
    if (pLife[k] <= 0) continue;
    pLife[k] -= dt;
    if (pLife[k] <= 0) { pPos[k * 3 + 1] = -999; continue; }
    pVel[k * 3 + 1] -= 5.4 * dt;
    pPos[k * 3] += pVel[k * 3] * dt; pPos[k * 3 + 1] += pVel[k * 3 + 1] * dt; pPos[k * 3 + 2] += pVel[k * 3 + 2] * dt;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}
const rings = [];
const ringGeo = new THREE.RingGeometry(0.35, 0.5, 44);
function shockwave(pos, color, maxR) {
  const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color, transparent: true,
    opacity: 0.9, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(pos.x, 0.07, pos.z); scene.add(m);
  rings.push({ m, t: 0, maxR: maxR || 3.4 });
}
function stepRings(dt) {
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i]; r.t += dt;
    const k = Math.min(1, r.t / 0.55);
    r.m.scale.setScalar(0.4 + k * r.maxR);
    r.m.material.opacity = 0.9 * (1 - k);
    if (k >= 1) { scene.remove(r.m); r.m.material.dispose(); rings.splice(i, 1); }
  }
}
function addLog(txt, cls) {
  const box = el('log');
  box.insertAdjacentHTML('afterbegin', '<div class="' + (cls || '') + '">' + txt + '</div>');
  while (box.children.length > 6) box.removeChild(box.lastChild);
}
let toastT = 0;
function toast(txt, color) {
  const t = el('toast');
  t.textContent = txt; t.style.color = color || '#facc15'; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 900);
}
function flash(color, power, dur) {
  master.color.set(color); master.intensity = power;
  setTimeout(() => { master.intensity = 0; }, dur || 220);
}

/* ---------- 7. 怪物同步：直接跟 core.js 的战斗上下文对齐 ---------- */
function mobPosOf(m) { return { x: -3.4 - (m.idx || 0) * 1.5, y: 0, z: (m.idx === 1 ? -2.1 : m.idx === 2 ? 2.1 : 0) }; }
function rebuildMob(gr) {
  gr.userData.fallback = !mobTplReady;
  const old = gr.children[0];
  const next = mobTplReady ? mobTpl.clone(true) : buildFallbackMob('beast');
  if (old) gr.remove(old);
  gr.add(next);
}
function syncMobs() {
  const list = (G.combat && G.combat.mobs) || [];
  const alive = new Set();
  list.forEach(m => {
    if (!m || m.hp <= 0) return;
    alive.add(m.idx);
    let gr = mobMeshes.get(m.idx);
    if (!gr) {
      gr = new THREE.Group();
      gr.userData.fallback = true;
      gr.add(buildFallbackMob(['beast', 'demon', 'ghost'][m.idx % 3]));
      const p = mobPosOf(m);
      gr.position.set(p.x, 0, p.z);
      gr.rotation.y = 1.2;
      scene.add(gr);
      mobMeshes.set(m.idx, gr);
      addLog('妖物现身', '');
    }
    const p = mobPosOf(m);
    gr.position.x += (p.x - gr.position.x) * 0.06;
    gr.position.z += (p.z - gr.position.z) * 0.06;
  });
  mobMeshes.forEach((gr, idx) => {
    if (alive.has(idx)) return;
    spawnParticles(gr.position, 34, '#facc15', 2.4, true);
    shockwave(gr.position, '#facc15', 4.0);
    scene.remove(gr); mobMeshes.delete(idx);
  });
}
function mobAnchor(idx) {
  const gr = mobMeshes.get(idx);
  return gr ? gr.position : new THREE.Vector3(-3.4, 0, 0);
}

/* ---------- 8. 姿态：核心是"把剑举起来"再劈下去 ---------- */
const pose = { arm: 0, armT: 0, swing: 0, hit: 0 };
function applyPose(dt) {
  const idle = Math.sin(performance.now() * 0.0016) * 0.03;
  heroRoot.position.y = idle;
  pose.arm += (pose.armT - pose.arm) * Math.min(1, dt * 8);
  const hold = G.raiseOn && G.raiseOn() ? 1 : 0;
  if (hold) pose.armT = 1; else if (pose.armT > 0.9) pose.armT = 0;
  const lift = Math.max(pose.arm, hold);
  const tgt = heroPivot || heroFallback;
  if (tgt) {
    /* 举剑：整体上提 + 前倾（GLB 是单体网格，剑与身同体，所以抬的是整个人） */
    heroRoot.rotation.z = lift * 0.06 - pose.swing * 0.16 + (pose.hit > 0 ? -0.2 * (pose.hit / 0.3) : 0);
    heroRoot.rotation.x = -pose.swing * 0.1;
    heroRoot.position.y += lift * 0.14 - pose.swing * 0.06;
    heroRoot.rotation.y = -0.95 + (hold ? -0.12 : 0);
  }
  if (pose.swing > 0) pose.swing = Math.max(0, pose.swing - dt / 0.24);
  if (pose.hit > 0) pose.hit -= dt;
}

/* ---------- 9. 事件：全部来自 core.js，与 2D 版同一批 ---------- */
G.on('raise', on => {
  pose.armT = on ? 1 : 0;
  if (on) { toast('举剑'); flash(COL.getHex(), 12, 320); spawnParticles(heroRoot.position, 22, COL.getStyle(), 1.1, true); }
});
G.on('skill', s => {
  pose.swing = 1;
  toast(s.name || '技能', SECT.color);
  flash(COL.getHex(), 16, 260);
  spawnParticles(heroRoot.position, 26, SECT.color, 1.3, true);
  shockwave(heroRoot.position, SECT.color, 2.6);
});
G.on('damage', d => {
  if (d.heal) { spawnParticles(heroRoot.position, 16, '#4ade80', 1.1, true); addLog('回复 <b>+' + G.fmt(d.amount) + '</b>', ''); return; }
  if (d.side === 'mob') {
    const a = mobAnchor(d.idx || 0);
    spawnParticles(a, d.crit ? 22 : 11, d.crit ? '#fde047' : SECT.color, 2.2, true);
    shockwave(a, d.crit ? '#fde047' : SECT.color, d.crit ? 2.8 : 1.8);
    addLog((d.crit ? '暴击 ' : '') + '<span class="hit">-' + G.fmt(d.amount) + '</span>', '');
  } else {
    pose.hit = 0.3;
    spawnParticles(heroRoot.position, 8, '#fca5a5', 1.4, false);
    addLog('受击 <span class="hit">-' + G.fmt(d.amount) + '</span>', '');
  }
});
G.on('mobAttack', e => { if (e && e.idx != null) pose.hit = 0.26; });

/* ---------- 10. 区域：用 core.js 的 REGIONS，切场景配色 ---------- */
const regionSel = el('region');
REGIONS.forEach(r => {
  const o = document.createElement('option');
  o.value = r.id; o.textContent = r.name;
  if (r.id === G.state.region) o.selected = true;
  regionSel.appendChild(o);
});
function applyRegion(id) {
  const r = G.regionOf ? G.regionOf(id) : (REGIONS.find(x => x.id === id) || {});
  const accent = new THREE.Color(r.accent || SECT.color || '#5eead4');
  ringEdge.material.color.copy(accent);
  ringEdge.material.emissive.copy(accent);
  const base = new THREE.Color(r.fog || 0x0b1220);
  scene.fog.color.copy(base);
  ground.material.color.set(r.ground || 0x8f9e88);
  hemi.color.copy(base).lerp(new THREE.Color(0xa9d3ff), 0.5);
  sun.color.set(r.sun || 0xffe6bd);
  layoutProps((r.range && r.range[0] ? r.range[0] : 7) * 9973);
}
applyRegion(G.state.region);
regionSel.addEventListener('change', () => {
  const id = regionSel.value;
  if (G.switchRegion) G.switchRegion(id, false);
  applyRegion(id);
  addLog('前往「' + (G.regionOf(id) || {}).name + '」', 'sk');
  toast((G.regionOf(id) || {}).name || '', SECT.color);
});

/* ---------- 11. 后处理：Bloom 让剑光/灵气真的发光 ---------- */
let composer = null, bloomPass = null;
function buildComposer() {
  const T = TIERS[tier];
  if (!T.bloom) { composer = null; bloomPass = null; return; }
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), T.bloom, 0.62, 0.82);
  composer.addPass(bloomPass);
  composer.setSize(innerWidth, innerHeight);
}
buildComposer();

/* ---------- 12. 画质切换 ---------- */
function applyTier() {
  const T = TIERS[tier];
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, T.dpr));
  renderer.shadowMap.enabled = T.shadow > 0;
  sun.castShadow = T.shadow > 0;
  if (T.shadow) {
    sun.shadow.mapSize.set(T.shadow, T.shadow);
    const c = sun.shadow.camera;
    c.left = -18; c.right = 18; c.top = 18; c.bottom = -18; c.updateProjectionMatrix();
  }
  buildTextures();
  ground.material.map = groundTex; ground.material.needsUpdate = true;
  discMat.map = rockTex; discMat.needsUpdate = true;
  scene.background = skyTex;
  applyEnv();
  buildComposer();
  layoutProps(20260926);
  el('quality').textContent = TIERS[tier].n;
  document.querySelectorAll('.badge').forEach(b => { b.style.borderColor = 'rgba(250,204,21,.35)'; });
}
el('quality').addEventListener('click', () => {
  tier = (tier + 1) % 3;
  localStorage.setItem('zx3d_tier', String(tier));
  applyTier();
  addLog('画质 → 「' + TIERS[tier].n + '」', '');
});
applyTier();

/* ---------- 13. HUD ---------- */
let hudT = 0;
function hud(dt) {
  hudT += dt; if (hudT < 0.1) return; hudT = 0;
  const s = G.state, st = G.stats();
  el('hpBar').style.transform = 'scaleX(' + Math.max(0, s.hp).toFixed(3) + ')';
  el('mpBar').style.transform = 'scaleX(' + Math.max(0, s.mp).toFixed(3) + ')';
  el('hpTxt').textContent = Math.round(s.hp * st.maxHp) + ' / ' + Math.round(st.maxHp);
  el('mpTxt').textContent = Math.round(s.mp * st.maxMp) + ' / ' + Math.round(st.maxMp);
  el('bLv').textContent = 'Lv.' + s.level + ' · ' + (SECT.name || '');
  el('bName').textContent = (s.name || '散修') + ' · ' + SECT.name;
}
el('fight').addEventListener('click', () => {
  const on = G.toggleAuto();
  el('fight').textContent = on ? '停战' : '开战';
  el('hint').style.opacity = on ? '0' : '1';
  addLog(on ? '开始挂机' : '已停战', 'sk');
  try { window.Music && Music.start && Music.start(); } catch (e) { }
});
el('back2d').addEventListener('click', () => { location.href = 'index.html'; });
el('fight').textContent = G.state.auto ? '停战' : '开战';

/* ---------- 14. 主循环：Game.tick 驱动真实战斗，本页只负责表现 ---------- */
let last = performance.now(), acc = 0, frames = 0, low = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (G.tick) G.tick(dt);            /* ← 真实战斗逻辑（境界/装备/技能/举剑都在里面） */
  syncMobs();
  applyPose(dt);
  stepParticles(dt);
  stepRings(dt);
  hud(dt);
  mobMeshes.forEach(gr => { gr.position.y = Math.abs(Math.sin(now * 0.0028)) * 0.06; });
  const cx = mobMeshes.size ? [...mobMeshes.values()].reduce((a, g) => a + g.position.x, 0) / mobMeshes.size : heroRoot.position.x;
  controls.target.lerp(new THREE.Vector3((heroRoot.position.x + cx) * 0.32, 2.05, 0), 0.035);
  controls.update();
  master.position.set(heroRoot.position.x - 0.3, 2.6, 0.5);
  if (composer) composer.render(); else renderer.render(scene, camera);

  frames++; acc += dt;
  if (acc >= 0.6) {
    const fps = frames / acc; frames = 0; acc = 0;
    el('fps').textContent = Math.round(fps) + ' FPS\n' + TIERS[tier].n + '档' + (composer ? ' · Bloom' : '');
    if (fps < 42 && tier > 0) { if (++low >= 3) { low = 0; tier--; applyTier(); addLog('帧率偏低 → 自动降到「' + TIERS[tier].n + '」', ''); } }
    else low = 0;
  }
  requestAnimationFrame(loop);
}
function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  camera.fov = w / h < 1 ? 56 : 46;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
  if (composer) composer.setSize(w, h);
}
addEventListener('resize', resize);
resize();
setTimeout(() => { el('loading').classList.add('done');
  addLog('拖动画布环视 · 点「开战」开始挂机', 'sk');
  if (G.state.auto) el('hint').style.opacity = '0'; }, 500);
requestAnimationFrame(loop);
</script>
